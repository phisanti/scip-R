url: https://phisanti.github.io/scip-R/

home:
  title: "scipR: SCIP Indexer for R Workspaces"
  description: >
    Generate SCIP indexes for R projects so code search and navigation tools
    can answer "where is this defined" and "who calls this" without parsing R.
  sidebar:
    structure: [links, license, authors, dev]
    components:
      links:
        title: "Links"
        text: |
          - [GitHub repository](https://github.com/phisanti/scip-R)
          - [Report an issue](https://github.com/phisanti/scip-R/issues)
          - [SCIP protocol](https://github.com/scip-code/scip)

template:
  bootstrap: 5
  light-switch: true
  theme: github-light
  theme-dark: github-dark
  bslib:
    primary: "#0066cc"

navbar:
  structure:
    left: [intro, reference]
    right: [search, github, lightswitch]
  components:
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/phisanti/scip-R
      aria-label: "View source code on GitHub"

reference:
- title: "Indexing"
  contents:
  - index_project
  - validate_args
- title: "Command-line tool"
  contents:
  - install_scip_cli

footer:
  structure:
    left: [developed_by, built_with]
    right: [github]
  components:
    github: |
      [Source code](https://github.com/phisanti/scip-R)
